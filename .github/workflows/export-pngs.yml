name: Export PNGs from SVGs

on:
  push:
    paths:
      - 'source/**'
      - 'data/bank.json'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run export script
        run: node scripts/export-pngs.js

      - name: Commit and push output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add logos/ dist/
          git diff --staged --name-only -- '*.png' > /tmp/changed_pngs.txt
          git diff --staged --quiet || git commit -m "chore: auto-export PNGs and update live_banks JSON"
          git push

      - name: Purge jsDelivr cache for updated logos
        run: |
          python3 << 'EOF'
          import urllib.parse, subprocess

          with open('/tmp/changed_pngs.txt') as f:
              paths = [l.strip() for l in f if l.strip().endswith('.png')]

          if not paths:
              print("No PNG changes — nothing to purge")
          else:
              print(f"Purging {len(paths)} file(s) from jsDelivr cache...")
              for path in paths:
                  url = f"https://purge.jsdelivr.net/gh/Onowomano/moniepal-bank-logos@main/{urllib.parse.quote(path)}"
                  print(f"  {path}")
                  subprocess.run(["curl", "-sf", url], check=False)
          EOF